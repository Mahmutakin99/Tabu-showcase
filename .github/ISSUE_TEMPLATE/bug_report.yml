name: Hata bildirimi / Bug report
description: Gözlemlediğiniz sorunu kişisel bilgi paylaşmadan anlatın.
title: "[Hata] "
body:
  - type: markdown
    attributes:
      value: "Bu depo ürün vitrinidir. Mesaj, hesap bilgisi, özel fotoğraf, anahtar veya pano içeriği paylaşmayın. / Do not include private data."
  - type: input
    id: environment
    attributes:
      label: Cihaz ve işletim sistemi / Device and OS
      placeholder: "Örnek: iPhone, iOS sürümü veya Mac modeli, macOS sürümü"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü / App version
      placeholder: "Biliyorsanız sürüm ve derleme numarası; bilmiyorsanız belirtin."
  - type: textarea
    id: steps
    attributes:
      label: Yeniden oluşturma adımları / Steps to reproduce
      description: Hangi ekranda, hangi işlemden sonra oldu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen ve görülen davranış / Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Paylaşım kontrolü / Privacy check
      options:
        - label: Bu bildirime kişisel veri veya gizli bilgi eklemedim. / No personal data or secrets are included.
          required: true
